name: LibreNMS Testing
on:
  workflow_dispatch:
    inputs:
      librenms_version:
        description: 'LibreNMS version to test'
        required: true
        default: 'latest'

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

jobs:
  # Ensure project builds before running testing matrix
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go build -v .

  # Ensure project builds before running testing matrix
  test:
    name: LibreNMS Integration Test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIBRENMS_VERSION: ${{ github.event.inputs.librenms_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.*
          terraform_wrapper: false
      - run: go mod download
      - name: "Start Dev LibreNMS"
        run: "make dev-testacc"
      - name: "Run Acceptance Tests"
        run: "make testacc"
        timeout-minutes: 10

