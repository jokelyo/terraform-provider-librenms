name: golangci-lint
on:
#  pull_request:
#    paths-ignore:
#      - 'README.md'
#      - 'development/'
  push:
    paths-ignore:
      - 'README.md'
      - 'development/'

permissions:
  contents: read
  # Optional: allow read access to pull requests. Use with `only-new-issues` option.
  # pull-requests: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15
